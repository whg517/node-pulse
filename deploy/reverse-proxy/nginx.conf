# Node-Pulse nginx reverse proxy reference.
#
# Used together with certbot (`sudo certbot --nginx -d pulse.example.com`),
# which rewrites the server block below to listen on 443 + TLS and adds a
# redirect from port 80. Replace pulse.example.com with your domain.
#
# Closes the D-G1 gap (docs/deployment-tls.md).

# Upstream definition — Pulse listens in plaintext on 6532.
upstream node_pulse_backend {
    server 127.0.0.1:6532;
    keepalive 32;
}

# HTTP → HTTPS redirect. certbot will keep this in place after it issues
# the certificate; if you supply your own cert, enable the 443 block below.
server {
    listen 80;
    listen [::]:80;
    server_name pulse.example.com;

    # certbot's webroot challenge must pass through before the redirect kicks
    # in — leave this location block in place even before running certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server. Initially certbot generates this block; if you manage your
# own cert, point ssl_certificate / ssl_certificate_key accordingly.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pulse.example.com;

    # certbot manages these lines once it issues the certificate:
    # ssl_certificate     /etc/letsencrypt/live/pulse.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pulse.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Reverse proxy to Pulse — covers the SPA, /api/v1/*, /metrics, /swagger/*.
    location / {
        proxy_pass http://node_pulse_backend;
        proxy_http_version 1.1;

        # WebSocket upgrade (required for /api/v1/realtime). Without this
        # the live alert/node stream silently falls back to polling.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Forward original request metadata so Pulse's c.ClientIP() and the
        # audit log record the real caller, not the proxy.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't buffer streaming / SSE responses.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

# Map used by the WebSocket Upgrade header above.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
