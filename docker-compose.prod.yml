# Production-grade single-host deployment for Node-Pulse.
#
# The frontend is embedded into the Pulse binary (//go:embed), so a single
# container serves both the SPA and the API. Only PostgreSQL + Pulse are
# needed; there is no separate frontend/nginx container.
#
# Beacon agents are deployed separately on each monitored node (see
# beacon/Dockerfile); they report into the pulse service over the network.
#
# Usage:
#   cp .env.example .env   # then edit secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Override any PULSE_* / POSTGRES_* value via the shell environment or .env.

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nodepulse}
      POSTGRES_USER: ${POSTGRES_USER:-nodepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodepulse} -d ${POSTGRES_DB:-nodepulse}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not exposed to the host by default; pulse talks to it on the compose
    # network. Uncomment to inspect it locally.
    # ports: ["5432:5432"]

  pulse:
    build:
      # Context is the repo root because the Dockerfile builds the frontend
      # (../frontend) and embeds it into the Go binary.
      context: .
      dockerfile: pulse/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database — uses the compose service name as the host.
      PULSE_DATABASE_URL: postgres://${POSTGRES_USER:-nodepulse}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nodepulse}?sslmode=disable
      PULSE_SERVER_MODE: ${PULSE_SERVER_MODE:-release}
      PULSE_SERVER_BASE_URL: ${PULSE_SERVER_BASE_URL:-http://localhost:${PULSE_PORT:-6532}}
      # Secrets — must be supplied. Auto-generated defaults only for local dev.
      PULSE_ADMIN_USERNAME: ${PULSE_ADMIN_USERNAME:-admin}
      PULSE_ADMIN_PASSWORD: ${PULSE_ADMIN_PASSWORD:?PULSE_ADMIN_PASSWORD is required}
      PULSE_SESSION_SECRET: ${PULSE_SESSION_SECRET:?PULSE_SESSION_SECRET is required}
      PULSE_JWT_SECRET: ${PULSE_JWT_SECRET:?PULSE_JWT_SECRET is required}
      # The SPA is same-origin now; CORS still allows any separate tooling clients.
      PULSE_CORS_ALLOWED_ORIGINS: ${PULSE_CORS_ALLOWED_ORIGINS:-http://localhost}
      # Telemetry is opt-in.
      PULSE_TELEMETRY_ENABLED: ${PULSE_TELEMETRY_ENABLED:-false}
    ports:
      - "${PULSE_PORT:-6532}:6532"

volumes:
  postgres_data:
