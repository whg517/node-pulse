# E2E Test Environment
# Complete environment for running end-to-end tests
#
# Usage:
#   Start:  docker-compose -f e2e/docker-compose.e2e.yml up -d
#   Stop:   docker-compose -f e2e/docker-compose.e2e.yml down
#   Logs:   docker-compose -f e2e/docker-compose.e2e.yml logs -f
#
# After starting, run tests with:
#   cd e2e && npm test

services:
  # PostgreSQL Test Database
  postgres-test:
    image: postgres:15-alpine
    container_name: nodepulse-e2e-db
    environment:
      POSTGRES_DB: nodepulse_test
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d nodepulse_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - e2e-network

  # Pulse Backend API Server
  pulse-backend:
    build:
      context: ../pulse
      dockerfile: Dockerfile
    container_name: nodepulse-e2e-backend
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      # Database connection
      PULSE_DATABASE_URL: postgresql://testuser:testpass123@postgres-test:5432/nodepulse_test?sslmode=disable
      # Server configuration
      PULSE_SERVER_PORT: 6532
      PULSE_LOG_LEVEL: info
      # CORS - allow frontend origin
      PULSE_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://frontend:5173
      # Admin credentials (for e2e tests)
      PULSE_ADMIN_USERNAME: admin
      PULSE_ADMIN_PASSWORD: Admin123
      # Secrets (at least 64 bytes for JWT, auto-generated if not set)
      PULSE_JWT_SECRET: e2e-test-jwt-secret-do-not-use-in-production-must-be-at-least-64-bytes-long!!!
      PULSE_SESSION_SECRET: e2e-test-session-secret-do-not-use-in-production-must-be-long-enough!!!
      # Disable rate limiting for parallel E2E/visual stability
      PULSE_RATE_LIMIT_ENABLED: "false"
    ports:
      - "6532:6532"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:6532/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - e2e-network

  # Frontend React App (Development Server)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: nodepulse-e2e-frontend
    depends_on:
      pulse-backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://localhost:6532
      VITE_API_PROXY_TARGET: http://pulse-backend:6532
    ports:
      - "5173:5173"
    networks:
      - e2e-network

networks:
  e2e-network:
    driver: bridge

volumes:
  postgres_e2e_data:
