# E2E test stack for Node-Pulse: PostgreSQL + Pulse (which serves the embedded
# frontend too). Playwright runs on the host and hits Pulse on port 6532.
#
# Port choices:
#   - DB exposed on 5433 to avoid clashing with other Postgres on 5432.
#   - Pulse on 6532 — the single origin for both the SPA and the API.
#
# Usage:
#   cd e2e
#   npm run docker:up
#   E2E_BASE_URL=http://localhost:6532 npm run test:smoke:fast
#   npm run docker:down

services:
  postgres:
    image: postgres:15-alpine
    container_name: nodepulse-e2e-db
    environment:
      POSTGRES_DB: nodepulse_e2e
      POSTGRES_USER: nodepulse
      POSTGRES_PASSWORD: nodepulse123
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodepulse -d nodepulse_e2e"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data

  pulse:
    build:
      # Repo root context so the Dockerfile can build + embed the frontend.
      context: ..
      dockerfile: pulse/Dockerfile
    container_name: nodepulse-e2e-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PULSE_DATABASE_URL: postgres://nodepulse:nodepulse123@postgres:5432/nodepulse_e2e?sslmode=disable
      PULSE_SERVER_MODE: debug
      PULSE_SERVER_BASE_URL: http://localhost:6532
      PULSE_ADMIN_USERNAME: admin
      PULSE_ADMIN_PASSWORD: Admin123
      PULSE_SESSION_SECRET: e2e-session-secret-not-for-production-use
      PULSE_JWT_SECRET: e2e-jwt-secret-not-for-production-use
      PULSE_CORS_ALLOWED_ORIGINS: http://localhost:6532,http://127.0.0.1:6532
      PULSE_SESSION_COOKIE_SECURE: "false"
    ports:
      - "6532:6532"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:6532/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_e2e_data:
