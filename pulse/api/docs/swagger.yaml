basePath: /api/v1
definitions:
  github_com_kevin_node-pulse_pulse-api_internal_models.CreateNodeRequest:
    properties:
      ip:
        maxLength: 45
        type: string
      name:
        maxLength: 255
        type: string
      region:
        maxLength: 100
        type: string
      tags:
        additionalProperties: true
        type: object
    required:
    - ip
    - name
    - region
    type: object
  github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  github_com_kevin_node-pulse_pulse-api_internal_models.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  github_com_kevin_node-pulse_pulse-api_internal_models.LoginResponse:
    properties:
      data:
        properties:
          role:
            type: string
          user_id:
            type: string
          username:
            type: string
        type: object
      message:
        type: string
      timestamp:
        type: string
    type: object
  github_com_kevin_node-pulse_pulse-api_internal_models.Node:
    properties:
      created_at:
        type: string
      id:
        type: string
      ip:
        type: string
      last_heartbeat:
        description: Beacon heartbeat time
        type: string
      last_report_time:
        description: Data write time
        type: string
      name:
        type: string
      region:
        type: string
      status:
        description: online/offline/connecting
        type: string
      tags:
        description: JSONB stored as string
        type: string
      updated_at:
        type: string
    type: object
  internal_health.AlertEngineStatus:
    properties:
      cached_rules:
        type: integer
      metric_channel_capacity:
        type: integer
      metric_channel_depth:
        type: integer
      rule_cache_last_refresh:
        type: string
      status:
        description: ok, stale, full
        type: string
    type: object
  internal_health.AlertSuppressionStatus:
    properties:
      active_suppression_count:
        type: integer
      status:
        description: ok, error
        type: string
    type: object
  internal_health.AlertSystemStatus:
    properties:
      alert_engine:
        $ref: '#/definitions/internal_health.AlertEngineStatus'
      alert_suppression:
        $ref: '#/definitions/internal_health.AlertSuppressionStatus'
      webhook_delivery:
        $ref: '#/definitions/internal_health.WebhookDeliveryStatus'
    type: object
  internal_health.HealthResponse:
    properties:
      alert_system:
        $ref: '#/definitions/internal_health.AlertSystemStatus'
      checks:
        additionalProperties:
          type: string
        type: object
      scheduler:
        $ref: '#/definitions/internal_health.SchedulerStatus'
      status:
        type: string
      timestamp:
        type: string
    type: object
  internal_health.SchedulerStatus:
    properties:
      running:
        type: boolean
      tasks:
        additionalProperties:
          $ref: '#/definitions/internal_health.TaskStatusInfo'
        type: object
    type: object
  internal_health.TaskStatusInfo:
    properties:
      is_running:
        type: boolean
      last_error:
        type: string
      last_run:
        type: string
      run_count:
        type: integer
    type: object
  internal_health.WebhookDeliveryStatus:
    properties:
      status:
        description: healthy, degraded, unhealthy, nodata
        type: string
      success_count:
        type: integer
      success_rate:
        description: 0-100
        type: number
      total_count:
        type: integer
    type: object
host: localhost:6532
info:
  contact:
    email: support@example.com
    name: API Support
    url: https://github.com/kevin/node-pulse
  description: |-
    Node Pulse is a distributed monitoring system for tracking node health, metrics, and alerts in real-time.

    ## Features
    - Real-time beacon heartbeat monitoring
    - Multi-metric data collection and analysis
    - Configurable alert rules with suppression
    - Webhook notifications for alerts
    - Historical data queries and export
    - Role-based access control (RBAC)

    ## Authentication
    Most endpoints require authentication. Use the `/api/v1/auth/login` endpoint to obtain a session token.
    Include the token in the `Authorization` header: `Bearer <your-token>`
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Node Pulse API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: |-
        Authenticates a user and returns a session token. Supports username/password authentication.

        **Rate Limiting:** Maximum 5 failed attempts per IP per 15 minutes.
        **Account Lockout:** 6 failed attempts will lock the account for 10 minutes.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.LoginResponse'
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
        "423":
          description: Account locked
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
        "429":
          description: Rate limit exceeded
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
      summary: User login
      tags:
      - auth
  /health:
    get:
      consumes:
      - application/json
      description: |-
        Returns the health status of the API service, including database, scheduler, and alert system components.

        **Status values:**
        - `healthy`: All components are operational
        - `degraded`: Some components are non-critically failing
        - `unhealthy`: Critical components are failing
      produces:
      - application/json
      responses:
        "200":
          description: Health status
          schema:
            $ref: '#/definitions/internal_health.HealthResponse'
      summary: Health check
      tags:
      - health
  /nodes:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all nodes. Supports filtering by region.
      parameters:
      - description: Filter by region
        example: us-west
        in: query
        name: region
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of nodes
          schema:
            items:
              $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.Node'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List all nodes
      tags:
      - nodes
    post:
      consumes:
      - application/json
      description: Creates a new monitoring node. If a node with the same name and
        IP exists, it will be updated instead.
      parameters:
      - description: Node creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.CreateNodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Node updated successfully (duplicate found)
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.Node'
        "201":
          description: Node created successfully
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.Node'
        "400":
          description: Invalid request parameters
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
        "403":
          description: Forbidden (requires admin or operator role)
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a new node
      tags:
      - nodes
  /nodes/{id}:
    get:
      consumes:
      - application/json
      description: Retrieves detailed information about a specific node by its UUID.
      parameters:
      - description: Node UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Node details
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.Node'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
        "404":
          description: Node not found
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_kevin_node-pulse_pulse-api_internal_models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get node by ID
      tags:
      - nodes
securityDefinitions:
  BearerAuth:
    description: Enter the token with the `Bearer ` prefix, e.g. "Bearer abcde12345"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
