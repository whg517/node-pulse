info:
  contact:
    email: support@example.com
    name: API Support
    url: https://github.com/kevin/node-pulse
  description: |-
    Node Pulse is a distributed monitoring system for tracking node health, metrics, and alerts in real-time.

    ## Features
    - Real-time beacon heartbeat monitoring
    - Multi-metric data collection and analysis
    - Configurable alert rules with suppression
    - Webhook notifications for alerts
    - Historical data queries and export
    - Role-based access control (RBAC)

    ## Authentication
    Most endpoints require authentication. Use the `/api/v1/auth/login` endpoint to obtain a session token.
    Include the token in the `Authorization` header: `Bearer <your-token>`
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Node Pulse API
  version: "1.0"
