name: CI

on:
  push:
    paths:
      - .github/workflows/**
      - beacon/**
      - deploy/**
      - frontend/**
      - pulse/**
  pull_request:
    paths:
      - .github/workflows/**
      - beacon/**
      - deploy/**
      - frontend/**
      - pulse/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      beacon: ${{ steps.filter.outputs.beacon }}
      pulse: ${{ steps.filter.outputs.pulse }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            beacon:
              - '.github/workflows/**'
              - 'beacon/**'
            pulse:
              - '.github/workflows/**'
              - 'pulse/**'
            frontend:
              - '.github/workflows/**'
              - 'frontend/**'
            docker:
              - '.github/workflows/**'
              - '**/Dockerfile'
              - '**/Dockerfile.*'
              - '**/*.dockerfile'
              - 'docker-compose*.yml'
              - 'deploy/docker/**'
              - 'frontend/nginx.conf'

  beacon:
    name: Beacon Build And Test
    needs: changes
    if: needs.changes.outputs.beacon == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beacon
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: beacon/go.mod
          cache-dependency-path: beacon/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-only: true

      - name: Lint beacon
        run: make lint

      - name: Run beacon tests
        run: make test

      - name: Build beacon
        run: make build-local

  pulse:
    name: Pulse Build And Unit Test
    needs: changes
    if: needs.changes.outputs.pulse == 'true'
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nodepulse_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d nodepulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: pulse
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: pulse/go.mod
          cache-dependency-path: pulse/go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-only: true

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      # Generated Swagger docs are git-ignored; regenerate them from source
      # annotations so the build/tests that compile cmd/server succeed.
      - name: Generate Swagger docs
        run: make swag

      - name: Lint pulse
        run: make lint

      - name: Run pulse unit tests
        run: make test-unit

      - name: Build pulse API
        run: make build

      # Coverage is report-only: collected and uploaded as an artifact so it
      # can be inspected, but it does NOT gate the build (no threshold enforced).
      - name: Collect pulse coverage (report-only)
        run: make test-coverage
        continue-on-error: true

      - name: Upload pulse coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-coverage
          path: pulse/coverage.out
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend Lint Build And Test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm run test -- --run

      # Coverage is report-only: collected and uploaded as an artifact so it
      # can be inspected, but it does NOT gate the build (no threshold enforced).
      - name: Collect frontend coverage (report-only)
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload frontend coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------
  # E2E: spin up the full stack (Postgres + Pulse with embedded frontend) and
  # run the Playwright smoke suite against it. Heavy (builds the pulse image),
  # so it is gated behind a dedicated path filter and only runs the fast
  # Chromium smoke suite in CI.
  # ---------------------------------------------------------------------

  e2e:
    name: E2E (Playwright Smoke)
    needs: changes
    if: needs.changes.outputs.pulse == 'true' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start the E2E stack
        run: |
          docker compose -f docker-compose.e2e.yml up -d --build --wait
          echo "E2E_BASE_URL=http://localhost:6532" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright smoke suite (Chromium)
        run: npm run test:smoke:fast

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright traces (failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down the E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

  # ---------------------------------------------------------------------
  # Guardrails: catch whole-repo drift that the per-component jobs miss.
  # ---------------------------------------------------------------------

  go-mod-hygiene:
    name: Go Module Hygiene
    needs: changes
    # Run when either Go module or build files change. This catches un-tidy
    # go.mod/go.sum that would otherwise slip through component jobs.
    if: needs.changes.outputs.beacon == 'true' || needs.changes.outputs.pulse == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: pulse/go.mod
          cache-dependency-path: |
            pulse/go.sum
            beacon/go.sum

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Generate Swagger docs (pulse)
        working-directory: pulse
        # The generated api/docs package is git-ignored but imported by
        # cmd/server, so it must exist before `go mod tidy` can resolve imports.
        run: swag init -g cmd/server/main.go -o api/docs --parseDependency --parseInternal -q

      - name: Verify pulse go.mod/go.sum are tidy
        working-directory: pulse
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::pulse go.mod/go.sum not tidy. Run 'make tidy' and commit the result."
            git diff --stat -- go.mod go.sum
            exit 1
          }

      - name: Verify beacon go.mod/go.sum are tidy
        working-directory: beacon
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::beacon go.mod/go.sum not tidy. Run 'make tidy' and commit the result."
            git diff --stat -- go.mod go.sum
            exit 1
          }

  docker-build:
    name: Docker Build Smoke
    needs: changes
    # Build all three Dockerfiles so a regression in any production image is
    # caught at PR time (e.g. a new import the Dockerfile did not account for).
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build pulse image
        run: docker build -t node-pulse-api:test -f pulse/Dockerfile ./pulse

      - name: Build frontend image
        run: docker build -t node-pulse-ui:test -f frontend/Dockerfile ./frontend

      - name: Build beacon image
        run: docker build -t node-pulse-beacon:test -f beacon/Dockerfile ./beacon
