name: E2E Tests

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DB_URL: postgresql://testuser:testpass123@localhost:5432/nodepulse_test
  API_BASE_URL: http://localhost:6532
  FRONTEND_BASE_URL: http://localhost:5173
  PULSE_SERVER_PORT: 6532
  PULSE_JWT_SECRET: test-jwt-secret-for-ci
  PULSE_SESSION_SECRET: test-session-secret-for-ci
  PULSE_ADMIN_USERNAME: admin
  PULSE_ADMIN_PASSWORD: Admin123
  TEST_ADMIN_USER: admin
  TEST_ADMIN_PASS: Admin123

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Start full E2E stack
        run: |
          docker compose -f e2e/docker-compose.e2e.yml up -d --build

      - name: Wait for backend and frontend
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:6532/api/v1/health >/dev/null; then
              break
            fi
            sleep 2
          done

          for attempt in {1..60}; do
            if curl -fsS http://localhost:5173 >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:6532/api/v1/health >/dev/null
          curl -fsS http://localhost:5173 >/dev/null

      - name: Run smoke tests
        working-directory: e2e
        run: npm run test:smoke:fast

      - name: Capture stack logs
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml logs --no-color > e2e/docker-compose-smoke.log

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: |
            e2e/.auth
            e2e/playwright-report
            e2e/test-results
            e2e/docker-compose-smoke.log
          retention-days: 7

      - name: Stop full E2E stack
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml down -v

  e2e-tests:
    name: E2E ${{ matrix.project }}
    needs: smoke-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start full E2E stack
        run: docker compose -f e2e/docker-compose.e2e.yml up -d --build

      - name: Wait for backend and frontend
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:6532/api/v1/health >/dev/null; then
              break
            fi
            sleep 2
          done

          for attempt in {1..60}; do
            if curl -fsS http://localhost:5173 >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -fsS http://localhost:6532/api/v1/health >/dev/null
          curl -fsS http://localhost:5173 >/dev/null

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test --project=${{ matrix.project }}

      - name: Capture stack logs
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml logs --no-color > e2e/docker-compose-${{ matrix.project }}.log

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results-${{ matrix.project }}
          path: |
            e2e/.auth
            e2e/playwright-report
            e2e/test-results
            e2e/docker-compose-${{ matrix.project }}.log
          retention-days: 7

      - name: Stop full E2E stack
        if: always()
        run: docker compose -f e2e/docker-compose.e2e.yml down -v

  rate-limit-verification:
    name: Rate Limit Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: pulse/go.mod

      - name: Start test database
        working-directory: pulse
        run: make setup-test-db

      - name: Run rate limit integration test
        working-directory: pulse
        env:
          PULSE_RATE_LIMIT_ENABLED: "true"
        run: go test -p 1 ./tests/integration -run TestIntegration_RateLimit -count=1

      - name: Stop test database
        if: always()
        working-directory: pulse
        run: make cleanup-test-db
