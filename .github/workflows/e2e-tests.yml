name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PULSE_DATABASE_URL: postgresql://testuser:testpass123@localhost:5432/nodepulse_test
  PULSE_SERVER_PORT: 6532
  PULSE_JWT_SECRET: test-jwt-secret-for-ci
  PULSE_SESSION_SECRET: test-session-secret-for-ci
  PULSE_ADMIN_USERNAME: admin
  PULSE_ADMIN_PASSWORD: Admin123
  PULSE_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:4173,http://localhost:6532
  API_BASE_URL: http://localhost:6532
  FRONTEND_BASE_URL: http://localhost:4173

jobs:
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: nodepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: cd e2e && npm ci

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Setup Pulse backend
        run: |
          cd pulse
          go mod download
          go build -o bin/pulse ./cmd/server

      - name: Start Pulse server
        run: |
          cd pulse
          ./bin/pulse &
          sleep 5
        env:
          PULSE_DATABASE_URL: ${{ env.PULSE_DATABASE_URL }}
          PULSE_SERVER_PORT: ${{ env.PULSE_SERVER_PORT }}
          PULSE_JWT_SECRET: ${{ env.PULSE_JWT_SECRET }}
          PULSE_SESSION_SECRET: ${{ env.PULSE_SESSION_SECRET }}
          PULSE_ADMIN_USERNAME: ${{ env.PULSE_ADMIN_USERNAME }}
          PULSE_ADMIN_PASSWORD: ${{ env.PULSE_ADMIN_PASSWORD }}
          PULSE_LOG_LEVEL: error

      - name: Setup Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Start Frontend
        run: |
          cd frontend
          npm run preview &
          sleep 3

      - name: Health check
        run: |
          sleep 10
          curl -f http://localhost:6532/api/v1/health || exit 1
          curl -f http://localhost:4173 || exit 1

      - name: Run smoke tests
        run: cd e2e && npm run test:smoke:fast

      - name: Upload smoke test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: nodepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: cd e2e && npm ci

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Setup Pulse backend
        run: |
          cd pulse
          go mod download
          go build -o bin/pulse ./cmd/server

      - name: Start Pulse server
        run: |
          cd pulse
          ./bin/pulse &
          sleep 5
        env:
          PULSE_DATABASE_URL: ${{ env.PULSE_DATABASE_URL }}
          PULSE_SERVER_PORT: ${{ env.PULSE_SERVER_PORT }}
          PULSE_JWT_SECRET: ${{ env.PULSE_JWT_SECRET }}
          PULSE_SESSION_SECRET: ${{ env.PULSE_SESSION_SECRET }}
          PULSE_ADMIN_USERNAME: ${{ env.PULSE_ADMIN_USERNAME }}
          PULSE_ADMIN_PASSWORD: ${{ env.PULSE_ADMIN_PASSWORD }}
          PULSE_LOG_LEVEL: error

      - name: Setup Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Start Frontend
        run: |
          cd frontend
          npm run preview &
          sleep 3

      - name: Health check
        run: |
          sleep 10
          curl -f http://localhost:6532/api/v1/health || exit 1
          curl -f http://localhost:4173 || exit 1

      - name: Run E2E tests (sharded)
        env:
          # Pass full "1/3" value; TypeScript extracts the "1" at runtime
          SHARD_ID: ${{ matrix.shard }}
        run: cd e2e && npx playwright test --shard=${{ matrix.shard }} --project=chromium

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results-shard-${{ matrix.shard == '1/3' && '1' || matrix.shard == '2/3' && '2' || '3' }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  visual-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass123
          POSTGRES_DB: nodepulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: cd e2e && npm ci

      - name: Install Playwright browsers
        run: cd e2e && npx playwright install --with-deps chromium

      - name: Setup Pulse backend
        run: |
          cd pulse
          go mod download
          go build -o bin/pulse ./cmd/server

      - name: Start Pulse server
        run: |
          cd pulse
          ./bin/pulse &
          sleep 5
        env:
          PULSE_DATABASE_URL: ${{ env.PULSE_DATABASE_URL }}
          PULSE_SERVER_PORT: ${{ env.PULSE_SERVER_PORT }}
          PULSE_JWT_SECRET: ${{ env.PULSE_JWT_SECRET }}
          PULSE_SESSION_SECRET: ${{ env.PULSE_SESSION_SECRET }}
          PULSE_ADMIN_USERNAME: ${{ env.PULSE_ADMIN_USERNAME }}
          PULSE_ADMIN_PASSWORD: ${{ env.PULSE_ADMIN_PASSWORD }}
          PULSE_LOG_LEVEL: error

      - name: Setup Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Start Frontend
        run: |
          cd frontend
          npm run preview &
          sleep 3

      - name: Health check
        run: |
          sleep 10
          curl -f http://localhost:6532/api/v1/health || exit 1
          curl -f http://localhost:4173 || exit 1

      - name: Run visual tests
        run: cd e2e && npm run test:visual

      - name: Upload visual test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-test-results
          path: |
            e2e/playwright-report
            e2e/tests/visual/__screenshots__
          retention-days: 7

  report:
    name: Generate Test Report
    needs: [smoke-tests, e2e-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload combined report
        uses: actions/upload-artifact@v4
        with:
          name: combined-test-report
          path: artifacts/
          retention-days: 14
