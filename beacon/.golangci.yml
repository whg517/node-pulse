version: "2"

run:
  timeout: 5m
  tests: false
  skip-dirs:
    - vendor
  skip-files:
    - ".*\\.pb\\.go$"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
