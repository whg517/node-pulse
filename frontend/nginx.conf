# nginx site config for the Pulse frontend.
#
# Responsibilities:
#   1. Serve the Vite production bundle as static assets (gzip on).
#   2. Reverse-proxy /api and /ws to the Pulse backend so the SPA can use
#      same-origin relative URLs (VITE_API_BASE_URL empty in production),
#      avoiding cross-origin/CORS issues and the localhost:6532 default.
#   3. Fall back to index.html for unknown paths so BrowserRouter (history
#      mode) deep links and refreshes resolve client-side.
#
# The backend host:port defaults to pulse:6532 (the compose service name);
# override with an upstream change if the backend lives elsewhere.

upstream pulse_backend {
    server pulse:6532;
    # NOTE: if running nginx outside compose, replace 'pulse' with the host
    # where the Pulse API is reachable, e.g. server host.docker.internal:6532;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets for smaller transfers.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- reverse proxy to the Pulse backend ----
    # REST API
    location /api/ {
        proxy_pass http://pulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI (debug-mode backend)
    location /swagger/ {
        proxy_pass http://pulse_backend;
        proxy_set_header Host $host;
    }

    # Prometheus metrics (if exposed through the frontend edge)
    location /metrics {
        proxy_pass http://pulse_backend;
        proxy_set_header Host $host;
    }

    # WebSocket (realtime alert stream) — /ws
    location /ws {
        proxy_pass http://pulse_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400; # keep WS idle connections alive
    }

    # ---- static assets (long cache, immutable hashed files) ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback: unknown paths serve index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
